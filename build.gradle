plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'com.centers25'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.112-stable'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation('net.dv8tion:JDA:6.5.0') {
        exclude group: 'club.minnced', module: 'opus-java'
        exclude group: 'com.google.crypto.tink', module: 'tink'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 26
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveFileName = 'plugincore.jar'
    relocate 'com.google.gson', 'com.centers25.core.libs.gson'
}

tasks.register('apiJar', Jar) {
    archiveFileName = 'plugincore-api.jar'
    from sourceSets.main.output
    include 'com/centers25/core/discord/**'
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar'), tasks.named('apiJar')
}
